<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Alejandro Ruiz Muñoz — Full-Stack Developer and AI Automation Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F1A"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#1B1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42B883"/>
      <stop offset="0.5" stop-color="#D97757"/>
      <stop offset="1" stop-color="#FF2D20"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.55">
      <stop offset="0" stop-color="#42B883" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#42B883" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .flow { stroke-dasharray: 6 8; animation: flow 3s linear infinite; }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes flow { to { stroke-dashoffset: -56 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>
    <rect y="316" width="1200" height="4" fill="url(#accent)"/>

    <!-- left: identity -->
    <g class="mono" font-size="15" fill="#8B95A7">
      <text x="64" y="78">~/64train <tspan fill="#42B883">$</tspan> whoami</text>
    </g>
    <text x="62" y="140" class="sans" font-size="54" font-weight="700" fill="#F5F7FA">Alejandro Ruiz Muñoz</text>
    <text x="64" y="182" class="sans" font-size="23" font-weight="500" fill="#C9D1DC">Full-Stack Developer <tspan fill="#D97757">&amp;</tspan> AI Automation Engineer</text>
    <text x="64" y="214" class="sans" font-size="17" fill="#8B95A7">@ 64 Software Train · Málaga, Spain</text>

    <!-- chips -->
    <g class="sans" font-size="15" font-weight="600">
      <rect x="64" y="244" width="84" height="34" rx="17" fill="#42B883" fill-opacity="0.14" stroke="#42B883" stroke-opacity="0.55"/>
      <text x="106" y="266" text-anchor="middle" fill="#7EE2B5">Vue</text>
      <rect x="160" y="244" width="104" height="34" rx="17" fill="#FF2D20" fill-opacity="0.12" stroke="#FF2D20" stroke-opacity="0.55"/>
      <text x="212" y="266" text-anchor="middle" fill="#FF8A80">Laravel</text>
      <rect x="276" y="244" width="78" height="34" rx="17" fill="#F80000" fill-opacity="0.10" stroke="#F5A623" stroke-opacity="0.55"/>
      <text x="315" y="266" text-anchor="middle" fill="#F8C471">OCI</text>
      <rect x="366" y="244" width="166" height="34" rx="17" fill="#D97757" fill-opacity="0.16" stroke="#D97757" stroke-opacity="0.7"/>
      <text x="449" y="266" text-anchor="middle" fill="#F0A98C">Claude Agents</text>
      <rect x="544" y="244" width="138" height="34" rx="17" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.55"/>
      <text x="613" y="266" text-anchor="middle" fill="#C4B5FD">Automation</text>
    </g>

    <!-- right: agent graph -->
    <g transform="translate(820 52)">
      <rect width="320" height="216" rx="14" fill="#0B0F1A" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <circle cx="20" cy="18" r="5" fill="#FF5F57"/>
      <circle cx="38" cy="18" r="5" fill="#FEBC2E"/>
      <circle cx="56" cy="18" r="5" fill="#28C840"/>
      <text x="300" y="23" text-anchor="end" class="mono" font-size="12" fill="#5B6577">agent.flow</text>

      <g fill="none" stroke-width="2">
        <path class="flow" d="M160 74 C 160 100, 64 100, 64 128" stroke="#42B883" stroke-opacity="0.8"/>
        <path class="flow" d="M160 74 L 160 128" stroke="#D97757" stroke-opacity="0.9"/>
        <path class="flow" d="M160 74 C 160 100, 256 100, 256 128" stroke="#FF2D20" stroke-opacity="0.7"/>
        <path class="flow" d="M64 150 C 64 176, 160 170, 160 184" stroke="#5B6577"/>
        <path class="flow" d="M160 150 L 160 184" stroke="#5B6577"/>
        <path class="flow" d="M256 150 C 256 176, 160 170, 160 184" stroke="#5B6577"/>
      </g>

      <g class="mono" font-size="13" text-anchor="middle">
        <rect x="104" y="48" width="112" height="28" rx="8" fill="#D97757" fill-opacity="0.2" stroke="#D97757"/>
        <text x="160" y="67" fill="#F5F7FA">claude</text>
        <rect x="24" y="126" width="80" height="26" rx="8" fill="#111827" stroke="#42B883" stroke-opacity="0.8"/>
        <text x="64" y="144" fill="#7EE2B5">mcp</text>
        <rect x="120" y="126" width="80" height="26" rx="8" fill="#111827" stroke="#D97757" stroke-opacity="0.8"/>
        <text x="160" y="144" fill="#F0A98C">tools</text>
        <rect x="216" y="126" width="80" height="26" rx="8" fill="#111827" stroke="#FF2D20" stroke-opacity="0.8"/>
        <text x="256" y="144" fill="#FF8A80">api</text>
        <rect x="100" y="182" width="120" height="24" rx="8" fill="#42B883" fill-opacity="0.12" stroke="#42B883" stroke-opacity="0.6"/>
        <text x="160" y="199" fill="#C9D1DC">✓ done<tspan class="cursor" fill="#42B883">_</tspan></text>
      </g>
      <circle class="pulse" cx="226" cy="62" r="4" fill="#42B883"/>
    </g>
  </g>
</svg>
